name: wpdf-e2e

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 3s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:8089"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Notices, warnings and deprecations go to wp-content/debug.log; run.sh fails if the plugin causes any.
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/knuspermedia-local-fonts-icons:ro
      - ./fixtures:/var/www/html/wp-content/mu-plugins:ro
      - ./fixtures/wpdf-fixtures:/var/www/html/wp-content/plugins/wpdf-fixtures:ro
      # Same port inside and outside the container, so loopback requests (page check) reach the site.
      - ./apache-ports.conf:/etc/apache2/ports.conf:ro
      - ./apache-vhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro

  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    # Shares the WordPress container's localhost, so "wp local-fonts-icons scan" can reach the site.
    network_mode: "service:wordpress"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/knuspermedia-local-fonts-icons:ro
      - ./fixtures:/var/www/html/wp-content/mu-plugins:ro
      - ./fixtures/wpdf-fixtures:/var/www/html/wp-content/plugins/wpdf-fixtures:ro
    entrypoint: [ "wp" ]

volumes:
  wp:
